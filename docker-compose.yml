services:
  postgres:
    container_name: api_tb
    image: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=db_tb
    ports:
      - 6500:5432
  
  pgadmin:
    container_name: hopeful_dirac
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: gabriel.ov@proton.me
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - postgres
    # volumes:
    #   - postgres_data:/var/lib/postgresql/data/
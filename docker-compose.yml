services:
  postgres:
    image: postgres
    container_name: db_timebank
    ports:
      - 6500:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=db_timebank
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_timebank
    ports:
      - 5050:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=gabriel.ov@proton.me
      - PGADMIN_DEFAULT_PASSWORD=root
    volumes:
      - pgadmin_data:/pgadmin

volumes:
  postgres_data:
  pgadmin_data:

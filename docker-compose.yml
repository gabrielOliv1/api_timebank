services:
  postgres:
    image: postgres
    container_name: db_timebank
    restart: always
    ports:
      - 6500:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=db_timebank
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - timebank_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_timebank
    restart: always
    ports:
      - 5050:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=gabriel.ov@proton.me
      - PGADMIN_DEFAULT_PASSWORD=root
    volumes:
      - pgadmin_data:/pgadmin
    networks:
      - timebank_network

  app:
    build: .
    container_name: timebank_app
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - DATABASE_URL=postgresql://postgres:root@postgres:5432/db_timebank?schema=public
    depends_on:
      - postgres
    networks:
      - timebank_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  timebank_network:
    driver: bridge
